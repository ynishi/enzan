<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>enzan Balance Lab</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
      }
      textarea {
        width: 100%;
        height: 24rem;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      fieldset {
        margin: 1rem 0;
      }
      label {
        margin-right: 1rem;
      }
      table {
        border-collapse: collapse;
        margin: 0.5rem 0 1rem;
      }
      th,
      td {
        border: 1px solid #8886;
        padding: 0.15rem 0.6rem;
        text-align: right;
      }
      th {
        font-weight: 600;
      }
      td.left,
      th.left {
        text-align: left;
      }
      .ok {
        color: #2a7a2a;
      }
      .bad {
        color: #c02020;
      }
    </style>
  </head>
  <body>
    <h1>enzan Balance Lab</h1>

    <h2>Content</h2>
    <textarea id="spec" spellcheck="false"></textarea>
    <p><button id="validate" type="button">Validate</button> <span id="status"></span></p>
    <div id="issues"></div>

    <h2>Measure loot</h2>
    <fieldset>
      <label>Drop table <select id="table"></select></label>
      <label>Item level <input id="level" type="number" value="20" min="1" step="1" /></label>
      <label>Seed <input id="seed" type="text" value="1" size="22" /></label>
      <label
        >Trials <input id="trials" type="number" value="10000" min="1" step="1"
      /></label>
      <button id="run" type="button">Run</button>
    </fieldset>
    <div id="error" class="bad"></div>
    <div id="report"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
