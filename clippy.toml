# The core promises the same bits natively and in WebAssembly. std's math
# functions are not part of that promise: they give different bits on native,
# wasm32-wasip1 and wasm32-unknown-unknown. Running the tests on wasm32-wasip1
# stands in for the browser's wasm32-unknown-unknown only while the core uses
# the libm crate and basic arithmetic (+ - * / and sqrt, which IEEE 754 rounds
# exactly; mul_add is also exact and is not listed). This list enforces that.

disallowed-methods = [
    # Transcendental functions: use libm.
    { path = "f64::powf", reason = "use the libm crate: std's math gives different bits on native, wasm32-wasip1 and wasm32-unknown-unknown" },
