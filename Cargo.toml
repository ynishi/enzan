[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/enzan"
homepage = "https://github.com/ynishi/enzan"
documentation = "https://docs.rs/enzan"
readme = "README.md"

[workspace.dependencies]
thiserror = { version = "2", default-features = false }
libm = { version = "0.2.16", default-features = false }
wasm-bindgen = "0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
serde_path_to_error = "0.1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
